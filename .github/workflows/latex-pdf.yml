name: Build Resume PDF

on:
  workflow_dispatch:
    inputs:
      tex_file:
        description: "Relative path to the TeX file to compile"
        required: true
        type: string

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ inputs.tex_file }}

      - name: Locate compiled PDF
        id: output
        shell: bash
        run: |
          tex_file="${{ inputs.tex_file }}"
          pdf_name="$(basename "${tex_file%.tex}.pdf")"
          pdf_path="$(find . -type f -name "$pdf_name" | head -n 1)"

          if [[ -z "$pdf_path" ]]; then
            echo "Compiled PDF not found for input: $tex_file"
            exit 1
          fi

          echo "pdf_path=$pdf_path" >> "$GITHUB_OUTPUT"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: ${{ steps.output.outputs.pdf_path }}
          if-no-files-found: error
