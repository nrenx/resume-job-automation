<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume</title>
    <style>
      :root {
        --text: #111111;
        --muted: #4b4b4b;
        --rule: #1b1b1b;
      }

      @page {
        size: A4;
        margin: 0.4cm 0.8cm 0.5cm 0.8cm;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        color: var(--text);
        font-family: Charter, "Bitstream Charter", "Times New Roman", serif;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      body {
        font-size: 10pt;
        line-height: 1.15;
      }

      .page {
        width: 100%;
      }

      .header {
        text-align: center;
      }

      .name {
        font-size: 25pt;
        line-height: 1;
        font-weight: 500;
      }

      .contact-row {
        margin-top: 6px;
        font-size: 9.8pt;
        line-height: 1.25;
        color: var(--text);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 2px 0;
      }

      .contact-row a {
        color: inherit;
        text-decoration: none;
      }

      .contact-item {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }

      .contact-icon {
        width: 10.5px;
        height: 10.5px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: 0 0 auto;
      }

      .contact-icon-fill {
        fill: currentColor;
        stroke: none;
      }

      .separator {
        margin: 0 8px;
        color: var(--muted);
        white-space: nowrap;
      }

      .section {
        margin-top: 5px;
      }

      .section-title {
        font-size: 12.5pt;
        font-weight: 700;
        margin: 0;
        padding-bottom: 1px;
        border-bottom: 1px solid var(--rule);
      }

      .section-body {
        margin-top: 3px;
      }

      .paragraph {
        margin: 0;
      }

      .entry-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: start;
        margin-top: 4px;
      }

      .entry-main {
        min-width: 0;
      }

      .entry-meta {
        text-align: right;
        white-space: nowrap;
        color: var(--text);
      }

      .entry-title {
        font-weight: 700;
      }

      .entry-subtitle {
        font-weight: 400;
      }

      .bullets {
        margin: 3px 0 0 16px;
        padding: 0;
      }

      .bullets li {
        margin: 1px 0;
      }

      .skills-list {
        margin: 3px 0 0 16px;
        padding: 0;
        list-style: disc;
      }

      .skills-list li {
        margin: 1px 0;
      }

      .skills-label {
        font-weight: 700;
      }

      .inline-links {
        font-size: 9.2pt;
      }

      .inline-links a {
        color: inherit;
        text-decoration: none;
      }

      .small-note {
        margin-top: 3px;
        font-size: 9pt;
      }

      .small-note a {
        color: inherit;
      }

    </style>
  </head>
  <body>
    <main class="page" id="resume-root"></main>

    <script>
      const resume = {"basics":{"name":"Bollineni Narendra Chowdary","email":"narendrabollineni2002@gmail.com","phone":"+91 7989976214","portfolio":"https://nrenx.github.io/portfolio/","portfolioLabel":"nrenx.github.io/portfolio","github":"https://github.com/nrenx","githubLabel":"github.com/nrenx","linkedin":"https://linkedin.com/in/bollineninarendrachowdary","linkedinLabel":"linkedin.com/in/bollineninarendrachowdary","lastUpdated":"October 2025"},"objective":"Final-year Computer Science and Engineering student with expertise in full-stack development, UI/UX design, and workflow automation. Proficient in building SaaS applications using React, TypeScript, and Supabase. Completed a UI/UX internship at Zoro Innovations, contributing to multiple live projects.","education":[{"degree":"Bachelor of Engineering in Computer Science and Engineering(B.Tech)","institution":"NBKRIST College (Autonomous), Vidyanagar, Tirupati","period":"2022-2026","region":"Andhra Pradesh"},{"degree":"Intermediate(MPC)","institution":"Narayana Junior College, Gudur, Tirupati","period":"2020-2022","region":"Andhra Pradesh"},{"degree":"Secondary School Certificate (SSC)","institution":"Narayana EM High School, ISKON City, Nellore","period":"2019-2020","region":"Andhra Pradesh"}],"skills":[{"category":"Programming & Web","items":["JavaScript","HTML","CSS","TypeScript (Basic)","Python (Basic - scripting and automation)","Responsive UI Development"]},{"category":"Frameworks & Libraries","items":["React (Vite)","Tailwind CSS"]},{"category":"Backend & Cloud","items":["SQL","Supabase (Authentication, Realtime DB, Storage)","Firebase (Basic)","REST API Integration"]},{"category":"Automation & AI Tools","items":["n8n (Workflow Automation, API Pipelines, Scheduling)","OpenAI (ChatGPT)","Anthropic (Claude)","Grok","DeepSeek","Ollama (Local Models)","Google AI","Text-to-Speech for Automation Workflows"]},{"category":"Mobile Development","items":["Flutter (Basic Cross-Platform Development)","Android Studio (Basic)"]},{"category":"Tools & Others","items":["Git","GitHub","FFmpeg","Basic Understanding of Deployment and Hosting"]},{"category":"Soft Skills","items":["Problem solving","time management","team collaboration","fast learner","adaptability","communication."]}],"experience":[{"title":"UI/UX Design Intern","company":"Zoro Innovations","period":"July 2025 - August 2025","certificateUrl":"https://drive.google.com/file/d/1Mdj6kdTXaku3_Z-Vh2tATbli0cOKpZ-h/view?usp=sharing","certificateLabel":"View Certificate","details":["Designed user interfaces and experiences for campus administration and student management systems using industry-standard tools and methodologies."]},{"title":"Interview Coordination Support (Freelance)","company":"IT Hiring Process Support","period":"2024 (4-Month Freelance Assignment)","details":["Scheduled interviews by matching candidate availability with interviewer time slots.","Managed candidate follow-ups and interview status updates with clear communication."]}],"certifications":[{"name":"Google Cloud Presents Agentic AI Day 2025","issuer":"Hack2skill","url":"https://certificate.hack2skill.com/user/aidayideasubmission/2025H2S06AID-I11874"},{"name":"Critical Thinking and Problem Solving","issuer":"LinkedIn Learning"},{"name":"Python Programming","issuer":"Coursera"},{"name":"Web Development Fundamentals","issuer":"Udemy"}],"projects":[{"name":"Bhagavad Gita Multilingual Video Automation","links":[{"label":"GitHub","url":"https://github.com/nrenx/Bhagavad-gita"},{"label":"YouTube","url":"https://www.youtube.com/@Gita_Gyanaam/playlists"},{"label":"Instagram","url":"https://www.instagram.com/gita_gyanaam/"},{"label":"Facebook","url":"https://www.facebook.com/profile.php?id=61577900636828"}],"details":["Built a multilingual Bhagavad Gita platform and automated content workflow for verse-based video publishing."],"technologies":["Next.js (App Router)","React","TypeScript","Tailwind CSS","JSON-based verse data handling"],"tools":["n8n","Google Text-to-Speech","Google AI workflows","FFmpeg","YouTube/Instagram/Facebook publishing"]},{"name":"Kaveri Traders 3D Business Website","links":[{"label":"GitHub","url":"https://github.com/nrenx/kaveri_traders"},{"label":"Web App","url":"https://nrenx.github.io/kaveri_traders/"}],"details":["Built a premium business website with 3D-style scrollytelling visuals for wood supply services and lead generation."],"technologies":["Next.js 16 (App Router, static export)","TypeScript","Tailwind CSS v4","Framer Motion","Lenis"],"tools":["GitHub","GitHub Pages deployment","Responsive UI","WhatsApp CTA integration"]},{"name":"NBKRIST Student Portal","links":[{"label":"GitHub","url":"https://github.com/nrenx/nbkrist-student-portal"},{"label":"Web App","url":"https://nbkrstudenthub.me/"}],"details":["Built a student portal for accessing academic information, attendance records, and exam results without login."],"technologies":["Vite","React","TypeScript","React Router","Tailwind CSS","shadcn/ui","Supabase (DB + Auth)"],"tools":["Python data scraping/upload scripts","GitHub","GitHub Actions deployment","Google AdSense integration"]},{"name":"Sign Language Translator AI","links":[{"label":"GitHub","url":"https://github.com/nrenx/Sign-Language-Translator_using_AI-ML"}],"details":["Built a privacy-first, browser-based ASL translator with real-time hand gesture detection and speech/translation support."],"technologies":["Vite","React","TypeScript","TensorFlow.js","MediaPipe Hands","Tailwind CSS"],"tools":["On-device inference","Webcam-based live detection","Model training setup with Google Colab workflows"]}],"moreProjects":{"label":"More projects available at github.com/nrenx","url":"https://github.com/nrenx"}};

      const esc = (value) =>
        String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");

      const link = (url, label) => `<a href="${esc(url)}">${esc(label)}</a>`;

      const iconSvg = (name) => {
        const icons = {
          email:
            '<svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" ry="2"/><path d="M3 7l9 6 9-6"/></svg>',
          phone:
            '<svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.8 2.6a2 2 0 0 1-.4 2.1L8.2 9.8a16 16 0 0 0 6 6l1.4-1.3a2 2 0 0 1 2.1-.4c.8.4 1.7.7 2.6.8a2 2 0 0 1 1.7 2z"/></svg>',
          globe:
            '<svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18"/><path d="M12 3a15 15 0 0 0 0 18"/></svg>',
          github:
            '<svg class="contact-icon contact-icon-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.9c-2.8.6-3.4-1.2-3.4-1.2-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.6 1 1.6 1 .9 1.5 2.4 1.1 3 .8.1-.7.4-1.1.7-1.3-2.2-.2-4.5-1.1-4.5-5a3.9 3.9 0 0 1 1-2.7 3.6 3.6 0 0 1 .1-2.7s.8-.3 2.8 1a9.6 9.6 0 0 1 5.1 0c2-1.3 2.8-1 2.8-1 .4.9.4 1.9.1 2.7a3.9 3.9 0 0 1 1 2.7c0 3.9-2.3 4.8-4.6 5 .4.3.8 1 .8 2v3c0 .3.2.6.7.5A10 10 0 0 0 12 2Z"/></svg>',
          linkedin:
            '<svg class="contact-icon contact-icon-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5C4.98 4.6 4.1 5.5 3 5.5s-1.98-.9-1.98-2S1.9 1.5 3 1.5s1.98.9 1.98 2zM.5 8h5V23h-5V8zm7.5 0h4.8v2.1h.1c.7-1.3 2.4-2.6 5-2.6 5.3 0 6.3 3.5 6.3 8V23h-5v-6.6c0-1.6 0-3.6-2.2-3.6s-2.5 1.7-2.5 3.5V23H8V8z"/></svg>',
        };

        return icons[name] || "";
      };

      const buildContactLine = (basics) => {
        const items = [
          {
            icon: "email",
            href: `mailto:${basics.email}`,
            label: basics.email,
          },
          {
            icon: "phone",
            href: `tel:${basics.phone.replace(/\s+/g, "")}`,
            label: basics.phone,
          },
          {
            icon: "globe",
            href: basics.portfolio,
            label: basics.portfolioLabel || basics.portfolio,
          },
          {
            icon: "github",
            href: basics.github,
            label: basics.githubLabel || basics.github,
          },
          {
            icon: "linkedin",
            href: basics.linkedin,
            label: basics.linkedinLabel || basics.linkedin,
          },
        ];
        return items
          .map(
            (item) =>
              `<span class="contact-item">${iconSvg(item.icon)}${link(item.href, item.label)}</span>`,
          )
          .join('<span class="separator">|</span>');
      };

      const buildEducation = (education) =>
        education
          .map(
            (item) => `
            <div class="entry-row">
              <div class="entry-main">
                <div class="entry-title">${esc(item.degree)}</div>
                <div>${esc(item.institution)}</div>
              </div>
              <div class="entry-meta">
                <div>${esc(item.period)}</div>
                <div>${esc(item.region)}</div>
              </div>
            </div>
          `,
          )
          .join("");

      const buildSkills = (skills) =>
        `<ul class="skills-list">${skills
          .map(
            (item) => `<li><span class="skills-label">${esc(item.category)}:</span> ${esc(item.items.join(", "))}</li>`,
          )
          .join("")}</ul>`;

      const buildExperience = (experience) =>
        experience
          .map((item) => {
            const cert = item.certificateUrl
              ? ` - ${link(item.certificateUrl, item.certificateLabel || "View Certificate")}`
              : "";
            return `
            <div class="entry-row">
              <div class="entry-main">
                <span class="entry-title">${esc(item.title)}</span>
                <span class="entry-subtitle"> | ${esc(item.company)}${cert}</span>
              </div>
              <div class="entry-meta">${esc(item.period)}</div>
            </div>
            <ul class="bullets">
              ${item.details.map((d) => `<li>${esc(d)}</li>`).join("")}
            </ul>
          `;
          })
          .join("");

      const buildCertifications = (items) =>
        `<ul class="bullets">${items
          .map((item) => {
            if (item.url) {
              return `<li>${esc(item.name)} - ${esc(item.issuer)} (${link(item.url, "Certificate")})</li>`;
            }
            return `<li>${esc(item.name)} - ${esc(item.issuer)}</li>`;
          })
          .join("")}</ul>`;

      const buildProjects = (projects) =>
        projects
          .map(
            (item, index) => `
            <div class="entry-row">
              <div class="entry-main">
                <span class="entry-title">${index + 1}. ${esc(item.name)}</span>
              </div>
              <div class="entry-meta inline-links">${item.links
                .map((l) => link(l.url, l.label))
                .join(" | ")}</div>
            </div>
            <ul class="bullets">
              ${item.details.map((d) => `<li>${esc(d)}</li>`).join("")}
              <li><span class="skills-label">Technologies:</span> ${esc(item.technologies.join(", "))}</li>
              <li><span class="skills-label">Tools/Platforms:</span> ${esc(item.tools.join(", "))}</li>
            </ul>
          `,
          )
          .join("");

      const html = `
        <header class="header">
          <div class="name">${esc(resume.basics.name)}</div>
          <div class="contact-row">${buildContactLine(resume.basics)}</div>
        </header>

        <section class="section">
          <h2 class="section-title">Career Objective</h2>
          <div class="section-body">
            <p class="paragraph">${esc(resume.objective)}</p>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Education</h2>
          <div class="section-body">${buildEducation(resume.education)}</div>
        </section>

        <section class="section">
          <h2 class="section-title">Development & Technical Skills</h2>
          <div class="section-body">${buildSkills(resume.skills)}</div>
        </section>

        <section class="section">
          <h2 class="section-title">Work Experience</h2>
          <div class="section-body">${buildExperience(resume.experience)}</div>
        </section>

        <section class="section">
          <h2 class="section-title">Certifications</h2>
          <div class="section-body">${buildCertifications(resume.certifications)}</div>
        </section>

        <section class="section">
          <h2 class="section-title">Projects</h2>
          <div class="section-body">
            ${buildProjects(resume.projects)}
            <p class="small-note"><em>${link(resume.moreProjects.url, resume.moreProjects.label)}</em></p>
          </div>
        </section>
      `;

      document.getElementById("resume-root").innerHTML = html;
      document.body.dataset.rendered = "true";
    </script>
  </body>
</html>
